# Конфигурация Amvera для backend (окружение Docker).
# Предполагается, что в Amvera-репозиторий пушится содержимое папки backend/
# (git subtree push --prefix backend amvera master — см. DEPLOY_AMVERA.md).
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  containerPort: 8000
