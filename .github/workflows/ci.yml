name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Тесты используют in-memory SQLite (override get_db), но импорт модулей
      # требует валидный SECRET_KEY и непустой DATABASE_URL.
      SECRET_KEY: ci_test_secret_key_0123456789_0123456789_0123456789
      DATABASE_URL: sqlite:///./_ci_unused.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:verify
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  postgres:
    name: PostgreSQL migrations and regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: casemoney_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: casemoney_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casemoney_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci_test_secret_key_0123456789_0123456789_0123456789
      DATABASE_URL: postgresql://casemoney_test:ci_only_password@localhost:5432/casemoney_test
      TEST_DATABASE_URL: postgresql://casemoney_test:ci_only_password@localhost:5432/casemoney_test
      RATELIMIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic downgrade fe0a1b2c3d4e
      - run: alembic upgrade head
      - run: python scripts/verify_family_accounting_migration.py
      - run: pytest
