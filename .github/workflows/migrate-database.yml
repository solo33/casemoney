name: Migrate database to Amvera

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to confirm the copy from Neon to Amvera
        required: true
        type: string
      reset_target:
        description: Reset the target public schema before restore
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy and verify PostgreSQL
    runs-on: ubuntu-latest
    container: postgres:18
    timeout-minutes: 30
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TARGET_DATABASE_URL: ${{ secrets.AMVERA_DATABASE_URL }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RESET_TARGET: ${{ inputs.reset_target }}

    steps:
      - name: Install Amvera-compatible PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client-16

      - name: Validate confirmation and secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$CONFIRMATION" != "MIGRATE" ]]; then
            echo "Confirmation must be exactly MIGRATE."
            exit 1
          fi
          if [[ -z "$SOURCE_DATABASE_URL" || -z "$TARGET_DATABASE_URL" ]]; then
            echo "NEON_DATABASE_URL and AMVERA_DATABASE_URL repository secrets are required."
            exit 1
          fi
          if [[ "$SOURCE_DATABASE_URL" == "$TARGET_DATABASE_URL" ]]; then
            echo "Source and target URLs must be different."
            exit 1
          fi

      - name: Dump, restore, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_PSQL="/usr/lib/postgresql/18/bin/psql"
          SOURCE_PG_DUMP="/usr/lib/postgresql/18/bin/pg_dump"
          TARGET_PSQL="/usr/lib/postgresql/16/bin/psql"
          DUMP_FILE="${RUNNER_TEMP}/casemoney.sql"
          trap 'rm -f "$DUMP_FILE"' EXIT

          echo "Checking PostgreSQL connections and versions..."
          source_version="$("$SOURCE_PSQL" "$SOURCE_DATABASE_URL" -XAtc 'SHOW server_version_num;')"
          target_version="$("$TARGET_PSQL" "$TARGET_DATABASE_URL" -XAtc 'SHOW server_version_num;')"
          source_major=$((source_version / 10000))
          target_major=$((target_version / 10000))
          echo "Source PostgreSQL: ${source_major}; target PostgreSQL: ${target_major}."

          if (( target_major < source_major - 1 )); then
            echo "Only a one-major-version logical restore is allowed."
            exit 1
          fi

          target_tables="$("$TARGET_PSQL" "$TARGET_DATABASE_URL" -XAtc \
            "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema');")"
          if (( target_tables > 0 )) && [[ "$RESET_TARGET" != "true" ]]; then
            echo "Target contains ${target_tables} tables. Enable reset_target only for the new Amvera database."
            exit 1
          fi

          echo "Creating a private temporary dump on the GitHub runner..."
          "$SOURCE_PG_DUMP" --format=plain --no-owner --no-acl \
            --dbname "$SOURCE_DATABASE_URL" --file "$DUMP_FILE"
          test -s "$DUMP_FILE"

          # pg_dump 17+ wraps plain dumps in psql security meta-commands that
          # psql 16 does not know. They do not affect the SQL transaction.
          sed -i -e '/^\\restrict /d' -e '/^\\unrestrict /d' "$DUMP_FILE"

          if (( target_tables > 0 )); then
            echo "Resetting the target public schema..."
            "$TARGET_PSQL" "$TARGET_DATABASE_URL" -Xv ON_ERROR_STOP=1 \
              -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          fi

          echo "Restoring into Amvera in one transaction..."
          "$TARGET_PSQL" "$TARGET_DATABASE_URL" -Xv ON_ERROR_STOP=1 \
            --single-transaction --file "$DUMP_FILE"

          echo "Comparing table lists..."
          table_query="SELECT schemaname || '|' || tablename FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY 1;"
          source_tables_file="${RUNNER_TEMP}/source-tables.txt"
          target_tables_file="${RUNNER_TEMP}/target-tables.txt"
          "$SOURCE_PSQL" "$SOURCE_DATABASE_URL" -XAtc "$table_query" >"$source_tables_file"
          "$TARGET_PSQL" "$TARGET_DATABASE_URL" -XAtc "$table_query" >"$target_tables_file"
          diff -u "$source_tables_file" "$target_tables_file"

          echo "Comparing exact row counts..."
          checked=0
          while IFS='|' read -r schema table; do
            [[ -z "$schema" || -z "$table" ]] && continue
            qualified="$("$SOURCE_PSQL" "$SOURCE_DATABASE_URL" -XAt \
              -v schema="$schema" -v table="$table" \
              -c "SELECT format('%I.%I', :'schema', :'table');")"
            source_count="$("$SOURCE_PSQL" "$SOURCE_DATABASE_URL" -XAtc "SELECT count(*) FROM ${qualified};")"
            target_count="$("$TARGET_PSQL" "$TARGET_DATABASE_URL" -XAtc "SELECT count(*) FROM ${qualified};")"
            if [[ "$source_count" != "$target_count" ]]; then
              echo "Row count mismatch in ${qualified}: source=${source_count}, target=${target_count}."
              exit 1
            fi
            checked=$((checked + 1))
          done <"$source_tables_file"

          echo "Success: ${checked} tables and all exact row counts match."
          {
            echo "### Database migration verified"
            echo "- Source PostgreSQL: ${source_major}"
            echo "- Target PostgreSQL: ${target_major}"
            echo "- Tables checked: ${checked}"
            echo "- Exact row counts: all match"
          } >>"$GITHUB_STEP_SUMMARY"
