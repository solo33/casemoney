# Render.com Blueprint — бесплатный тестовый деплой CaseMoney.
# Создаёт backend (Docker) + статичный фронт. PostgreSQL размещается в Neon:
# бесплатная база Render удаляется через 30 дней, поэтому здесь она не создаётся.
# Заливается через https://dashboard.render.com → New → Blueprint → этот репозиторий.
#
# ВАЖНО: SECRET_KEY сгенерируется автоматически (generateValue). SMTP-переменные
# при необходимости добавьте вручную в дашборде сервиса casemoney-api.

services:
  # --- Backend (FastAPI, Docker) ---
  - type: web
    name: casemoney-api-solo33
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        value: https://casemoney-web-solo33.onrender.com
      - key: CORS_ORIGINS
        value: https://casemoney-web-solo33.onrender.com
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"

  # --- Frontend (Vite static) ---
  - type: web
    name: casemoney-web-solo33
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://casemoney-api-solo33.onrender.com
    routes:
      # SPA fallback — все маршруты на index.html
      - type: rewrite
        source: /*
        destination: /index.html
