# Render.com Blueprint — бесплатный тестовый деплой CaseMoney.
# Создаёт: Postgres + backend (Docker) + статичный фронт.
# Заливается через https://dashboard.render.com → New → Blueprint → этот репозиторий.
#
# ВАЖНО: SECRET_KEY сгенерируется автоматически (generateValue). SMTP-переменные
# при необходимости добавьте вручную в дашборде сервиса casemoney-api.

databases:
  - name: casemoney-db
    plan: free
    databaseName: casemoney
    user: casemoney

services:
  # --- Backend (FastAPI, Docker) ---
  - type: web
    name: casemoney-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casemoney-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        value: https://casemoney-web.onrender.com
      - key: CORS_ORIGINS
        value: https://casemoney-web.onrender.com
      - key: PORT
        value: "8000"

  # --- Frontend (Vite static) ---
  - type: web
    name: casemoney-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://casemoney-api.onrender.com
    routes:
      # SPA fallback — все маршруты на index.html
      - type: rewrite
        source: /*
        destination: /index.html
